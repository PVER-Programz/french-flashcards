<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="flashcards.css">
</head>
<body>

<main class="app">
<section class="topbar">
<div>
<p class="eyebrow">Study Deck</p>
<h1>French Flashcards</h1>
</div>
<span id="counter" class="pill">0 / 0</span>
</section>

<section class="progress-wrap">
<div id="progressBar" class="progress-bar"></div>
</section>

<section class="card" id="card">
<div class="card-inner">
<div class="card-face front">
<span class="label">Question</span>
<p id="question">Loading...</p>
</div>
<div class="card-face back">
<span class="label">Answer</span>
<p id="answer">Answer</p>
</div>
</div>
</section>

<section class="controls">
<button id="prevBtn" class="secondary">← Prev</button>
<button id="flipBtn" class="primary">Flip</button>
<button id="nextBtn" class="secondary">Next →</button>
</section>

<section class="controls small">
<button id="shuffleBtn">Shuffle</button>
<button id="resetBtn">Reset</button>
</section>

<p class="hint">Tap card to flip • Arrow keys to move • Space to flip</p>
</main>

<script src="script.js"></script>
</body>
</html>
